<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Detail Antipasti</title>
  <link rel="stylesheet" href="template.css"/>
  <link rel="stylesheet" href="detail.css" />
</head>
<body>
  <div class="detail-container" id="detailContainer"></div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const id = localStorage.getItem("selectedFoodId");

      if (!id) {
        document.getElementById("detailContainer").innerHTML = "<p>ID tidak ditemukan.</p>";
        return;
      }

      fetch("./JSON/antipasti.json")
        .then(res => res.json())
        .then(data => {
          const selectedItem = data.find(item => item.id == id);
          if (!selectedItem) {
            document.getElementById("detailContainer").innerHTML = "<p>Makanan tidak ditemukan.</p>";
            return;
          }

          document.getElementById("detailContainer").innerHTML = `
            <div class="detail-card">
              <img src="${selectedItem.img}" alt="${selectedItem.nama}">
              <h2>${selectedItem.nama}</h2>
              <p><strong>Tipe:</strong> ${selectedItem.tipe}</p>
              <p><strong>Deskripsi:</strong> ${selectedItem.deskripsi || "Deskripsi tidak tersedia."}</p>
            </div>
          `;
        });
    });
  </script>
</body>
</html>
