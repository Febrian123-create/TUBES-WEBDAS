<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Italian Antipasti Gallery</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background-color: #0f1616;
            color: white;
        }

        .page-header {
            text-align: center;
            padding: 80px 20px;
        }

        .main-title {
            font-family: 'Playfair Display', serif;
            font-size: 5.5rem;
            color: #c9a66b;
            margin: 0;
            line-height: 1;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 400;
        }

        .sub-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-top: 20px;
            color: white;
            font-weight: 400;
        }

        .gallery-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .recipe-card {
            position: relative;
            width: 300px;
            height: 400px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .recipe-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: all 0.4s ease;
        }

        .info-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 80%;
            background: #1a1a1a;
            border: 2px solid #c9a66b;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.4s ease;
            box-shadow: 0 0 30px rgba(0,0,0,0.7);
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .recipe-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: #c9a66b;
            margin: 0 0 10px 0;
            letter-spacing: 2px;
            font-weight: 400;
            line-height: 1.3;
            text-transform: uppercase;
        }

        .recipe-desc {
            font-family: 'Playfair Display', serif;
            font-size: 0.8rem;
            letter-spacing: 4px;
            color: #e0e0e0;
            text-transform: uppercase;
            margin-top: 10px;
        }

        .recipe-card:hover .info-box {
            opacity: 1;
        }

        .recipe-card:hover .recipe-image {
            filter: brightness(0.4);
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            .main-title {
                font-size: 3.5rem;
            }
            
            .sub-title {
                font-size: 1rem;
                letter-spacing: 5px;
            }
            
            .recipe-card {
                width: 100%;
                max-width: 350px;
                height: 350px;
            }
        }
    </style>
</head>
<body>
    <div class="page-header">
        <h1 class="main-title">ITALIAN<br>ANTIPASTI</h1>
        <p class="sub-title">Gallery</p>
    </div>

    <div class="gallery-container" id="recipeGallery"></div>

    <script>
        function renderRecipes(recipes) {
            const gallery = document.getElementById('recipeGallery');
            
            recipes.forEach((recipe, index) => {
                const card = document.createElement('div');
                card.className = 'recipe-card';
                
                if(index === 4) {
                    card.innerHTML = `<img src="${recipe.img}" class="recipe-image">`;
                } else {
                    card.innerHTML = `
                        <img src="${recipe.img}" alt="${recipe.nama}" class="recipe-image">
                        <div class="info-box">
                            <h3 class="recipe-name">${recipe.nama}</h3>
                            <p class="recipe-desc">${recipe.tipe}</p>
                        </div>
                    `;
                }
                
                gallery.appendChild(card);
            });
        }

        fetch('./JSON/antipasti.json')
            .then(response => response.json())
            .then(renderRecipes)
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('recipeGallery').innerHTML = `
                    <p style="color:white;text-align:center;width:100%;padding:40px;">
                        Error loading content.
                    </p>
                `;
            });
    </script>
</body>
</html>
