<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee & Cocktail Recipes</title>
    <style>
        /* Gaya dasar */
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background-color: #0f1616;
            color: white;
        }

        /* Header seperti di gambar referensi */
        .page-header {
            text-align: center;
            padding: 80px 20px;
            background-color: rgba(0, 0, 0, 0.7);
        }

        .main-title {
            font-family: 'Metropolis1920', sans-serif;
            font-size: 72px;
            color: #c9a66b;
            margin: 0;
            line-height: 1;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        .sub-title {
            font-size: 24px;
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-top: 20px;
        }

        .divider {
            width: 100px;
            height: 2px;
            background-color: #c9a66b;
            margin: 20px auto;
            opacity: 0.5;
        }

        /* Container card */
        .gallery-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Card styling */
        .recipe-card {
            position: relative;
            width: 300px;
            height: 400px;
            overflow: hidden;
            border-radius: 8px;
        }

        .recipe-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: all 0.3s ease;
        }

        /* Kotak info di atas card (bukan overlay) */
        .info-box {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            text-align: center;
            z-index: 2;
            transform: translateY(-150%);
            transition: transform 0.3s ease;
        }

        .recipe-name {
            font-family: 'Metropolis1920', sans-serif;
            font-size: 24px;
            color: #c9a66b;
            margin: 0 0 5px 0;
        }

        .recipe-type {
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 0;
        }

        /* Efek hover */
        .recipe-card:hover .info-box {
            transform: translateY(0);
        }

        .recipe-card:hover .recipe-image {
            transform: scale(1.05);
        }

        /* Responsif */
        @media (max-width: 768px) {
            .main-title {
                font-size: 48px;
            }
            
            .sub-title {
                font-size: 18px;
                letter-spacing: 5px;
            }
            
            .recipe-card {
                width: 100%;
                max-width: 350px;
                height: 350px;
            }
        }
    </style>
</head>
<body>
    <!-- Header seperti di gambar referensi -->
    <div class="page-header">
        <h1 class="main-title">COFFEE<br>COCKTAIL</h1>
        <div class="divider"></div>
        <p class="sub-title">Recipes</p>
    </div>

    <!-- Container untuk card -->
    <div class="gallery-container" id="recipeGallery"></div>

    <script>
        // Data JSON (bisa diganti dengan fetch dari file eksternal)
        const recipes = [
            {
                "id": 1,
                "name": "Espresso",
                "type": "Coffee",
                "image": "./tubesimg/bevande/Espresso.jpg"
            },
            {
                "id": 2,
                "name": "Cappuccino",
                "type": "Coffee",
                "image": "https://source.unsplash.com/random/600x800/?cappuccino"
            },
            {
                "id": 3,
                "name": "Latte Macchiato",
                "type": "Coffee",
                "image": "https://source.unsplash.com/random/600x800/?latte"
            },
            {
                "id": 4,
                "name": "Mojito",
                "type": "Cocktail",
                "image": "https://source.unsplash.com/random/600x800/?mojito"
            },
            {
                "id": 5,
                "name": "Martini",
                "type": "Cocktail",
                "image": "https://source.unsplash.com/random/600x800/?martini"
            },
            {
                "id": 6,
                "name": "Margarita",
                "type": "Cocktail",
                "image": "https://source.unsplash.com/random/600x800/?margarita"
            }
        ];

        // Fungsi untuk menampilkan card
        function renderRecipes() {
            const gallery = document.getElementById('recipeGallery');
            
            recipes.forEach(recipe => {
                const card = document.createElement('div');
                card.className = 'recipe-card';
                
                card.innerHTML = `
                    <div class="info-box">
                        <h3 class="recipe-name">${recipe.name}</h3>
                        <p class="recipe-type">${recipe.type}</p>
                    </div>
                    <img src="${recipe.image}" alt="${recipe.name}" class="recipe-image">
                `;
                
                gallery.appendChild(card);
            });
        }

        // Jalankan saat halaman dimuat
        document.addEventListener('DOMContentLoaded', renderRecipes);
    </script>
</body>
</html>
